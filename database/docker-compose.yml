services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: local-oracle-2
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: Oracle123!
      APP_USER: app_user
      APP_USER_PASSWORD: AppUser123!
    ports:
      - "1521:1521"
      - "5500:5500"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  oracle_data: